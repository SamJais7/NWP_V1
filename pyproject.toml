[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "satark-mausam-pratyay"
version = "2.0.0"
description = "AI-Based Forecast Bust Detection for Medium-Range Weather Forecasts (MoES / NCMRWF / IMD)"
authors = [
    { name = "Project Pratyay Development Team" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "xarray>=2024.0.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
deeplearning = [
    "torch>=2.1.0"
]
dev = [
    "pytest>=8.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
